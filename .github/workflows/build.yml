name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-change:
    name: Detect release merge
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.release.outputs.is-release }}
    steps:
      - uses: compas-dev/compas-actions/release-check@v1
        id: release

  build:
    needs: release-change
    if: github.event_name == 'pull_request' || needs.release-change.outputs.is-release != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: compas-dev/compas-actions/ci@v1
        with:
          python-version: ${{ matrix.python }}
          management-tool: uv
          invoke-tasks: lint test

  create-assets:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/release-assets@v1
        with:
          python-version: "3.12"
          management-tool: uv
          extras: dev
          invoke-tasks: pre-build
          paths: dist/proto/*.zip
          artifact-name: protobuf-test-assets
