syntax = "proto3";

package compas_pb.data;

import "compas_pb/generated/message.proto";

// ============================================================================
// Data Structures
// ============================================================================

// A single vertex attribute stored column-wise across vertices.
// If `indices` is empty the column is dense: one value per vertex, in vertex order.
// Otherwise `indices[k]` is the vertex index carrying the k-th value (sparse).
// Exactly one of the typed arrays / `values` is populated, selected by `kind`.
message AttributeColumn {
  string name = 1;
  repeated uint32 indices = 2;
  uint32 kind = 3;              // 0 = double, 1 = int, 2 = bool, 3 = generic AnyData
  repeated double doubles = 4;
  repeated sint64 ints = 5;
  repeated bool bools = 6;
  repeated AnyData values = 7;  // mixed / non-numeric columns
}

message MeshData {
  optional string guid = 1;
  optional string name = 2;
  repeated double vertices = 3; // flat coordinate array: 3 doubles (x, y, z) per vertex
  // Faces in CSR form: all face vertex indices concatenated, with face_sizes giving the
  // vertex count of each face (so face i spans the next face_sizes[i] entries).
  repeated uint32 face_vertices = 4;
  repeated uint32 face_sizes = 12;
  map<string, AnyData> attributes = 5;
  repeated AttributeColumn vertex_attribute_columns = 6; // vertex attrs, column-wise
  map<string, AnyData> face_attributes = 7;
  map<string, AnyData> edge_attributes = 8;
  map<string, AnyData> default_vertex_attributes = 9;
  map<string, AnyData> default_face_attributes = 10;
  map<string, AnyData> default_edge_attributes = 11;
}

message FaceData {
    repeated int32 vertex_indices = 1; // indices into the vertices array
}

message PolyhedronData {
    optional string guid = 1;
    optional string name = 2;
    repeated double vertices = 3; // flat x,y,z triplets
    repeated FaceData faces = 4;
}

message GraphData {
  optional string guid = 1;
  optional string name = 2;
  repeated AnyData node_keys = 3;               // node keys in order (arbitrary hashable)
  repeated AttributeColumn node_attributes = 4; // column-wise, including x/y/z coordinates
  map<string, AnyData> attributes = 5;
  map<string, AnyData> default_node_attributes = 6;
  map<string, AnyData> default_edge_attributes = 7;
  // Edges as index pairs into node_keys, with edge attributes stored column-wise.
  repeated uint32 edge_u = 8;
  repeated uint32 edge_v = 9;
  repeated AttributeColumn edge_attributes = 10;
}
