syntax = "proto3";

package compas_pb.data;

// ============================================================================
// Basic Geometry Types
// ============================================================================

message PointData {
  // no inheritance, so Data will have to repeat but apparently
  string guid = 1;
  string name = 2;
  double x = 3;
  double y = 4;
  double z = 5;
}

message VectorData {
  string guid = 1;
  string name = 2;
  double x = 3;
  double y = 4;
  double z = 5;
}

message FrameData {
  string guid = 1;
  string name = 2;
  PointData point = 3;
  VectorData xaxis = 4;
  VectorData yaxis = 5;
}

message PlaneData {
  string guid = 1;
  string name = 2;
  PointData point = 3;
  VectorData normal = 4;
}

message QuaternionData {
    string guid = 1;
    string name = 2;
    double w = 3;
    double x = 4;
    double y = 5;
    double z = 6;
}

// ============================================================================
// Curves
// ============================================================================

message LineData {
  string guid = 1;
  string name = 2;
  PointData start = 3;
  PointData end = 4;
}

message CircleData {
    string guid = 1;
    string name = 2;
    double radius = 3;
    FrameData frame = 4;
}

message ArcData {
  string guid = 1;
  string name = 2;
  CircleData circle = 3;
  double start_angle = 4;
  double end_angle = 5;
}

message EllipseData {
    string guid = 1;
    string name = 2;
    double major = 3;
    double minor = 4;
    FrameData frame = 5;
}

message ParabolaData {
    string guid = 1;
    string name = 2;
    double focal = 3;
    FrameData frame = 4;
}

message HyperbolaData {
    string guid = 1;
    string name = 2;
    double major = 3;
    double minor = 4;
    FrameData frame = 5;
}

message BezierData {
    string guid = 1;
    string name = 2;
    repeated double points = 3; // flat x,y,z triplets // control points
    int32 degree = 4;
}

message PolylineData {
    string guid = 1;
    string name = 2;
    repeated double points = 3; // flat x,y,z triplets
}

message PolygonData {
  string guid = 1;
  string name = 2;
  repeated double points = 3; // flat x,y,z triplets
}

// ============================================================================
// Surfaces
// ============================================================================

message BoxData {
  string guid = 1;
  string name = 2;
  FrameData frame = 3;
  double xsize = 4;
  double ysize = 5;
  double zsize = 6;
}

message SphereData {
    string guid = 1;
    string name = 2;
    double radius = 3;
    FrameData frame = 4;
}

message CylinderData {
    string guid = 1;
    string name = 2;
    double radius = 3;
    double height = 4;
    FrameData frame = 5;
}

message ConeData {
    string guid = 1;
    string name = 2;
    double radius = 3;
    double height = 4;
    FrameData frame = 5;
}

message CapsuleData {
    string guid = 1;
    string name = 2;
    double radius = 3;
    double height = 4;
    FrameData frame = 5;
}

message TorusData {
    string guid = 1;
    string name = 2;
    double radius_axis = 3;
    double radius_pipe = 4;
    FrameData frame = 5;
}

// ============================================================================
// Data Structures
// ============================================================================

message PointcloudData {
    string guid = 1;
    string name = 2;
    repeated double points = 3; // flat x,y,z triplets
}

// ============================================================================
// Transformations
// ============================================================================

message TransformationData {
    string guid = 1;
    string name = 2;
    repeated double matrix = 3; // 4x4 matrix stored as flat array of 16 floats
}

message TranslationData {
    string guid = 1;
    string name = 2;
    VectorData translation_vector = 3;
}

message RotationData {
    string guid = 1;
    string name = 2;
    repeated double matrix = 3; // 4x4 matrix stored as flat array of 16 doubles (exact round-trip)
}

message ScaleData {
    string guid = 1;
    string name = 2;
    repeated double matrix = 3; // 4x4 matrix stored as flat array of 16 floats
}

message ReflectionData {
    string guid = 1;
    string name = 2;
    repeated double matrix = 3; // 4x4 matrix stored as flat array of 16 floats
}

message ShearData {
    string guid = 1;
    string name = 2;
    repeated double matrix = 3; // 4x4 matrix stored as flat array of 16 floats
}

message ProjectionData {
    string guid = 1;
    string name = 2;
    repeated double matrix = 3; // 4x4 matrix stored as flat array of 16 floats
}
