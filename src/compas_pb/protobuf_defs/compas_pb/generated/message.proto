syntax = "proto3";

package compas_pb.data;

import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";

/** arbitrary container to hold message data and default data */
message AnyData {
  oneof data {
    google.protobuf.Any message = 1;
    google.protobuf.Value value = 2; // null / bool / str / bytes
    FallbackData fallback = 3;
    int64 int_value = 4;    // explicit int so it is not coerced from a float
    double double_value = 5; // explicit float so an integral value stays a float
    DictData dict_value = 6; // plain dict without the google.protobuf.Any type_url overhead
    ListData list_value = 7; // plain list without the google.protobuf.Any type_url overhead
  }
}

message FallbackData {
    DictData data = 1;
}

/** repeated serves as a list in protobuf */
message ListData {
  repeated AnyData items = 1;
}

/** repeated serves as a dict in protobuf */
message DictData {
  map<string, AnyData> items = 1;
}

/** root serialization element */
message MessageData {
  AnyData data = 1;
  optional string version = 2;
}
